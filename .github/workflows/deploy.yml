name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-minify-plugin
          npm install -g staticrypt

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          # Copy content folders
          for dir in 01_* 02_* 03_* 04_* 05_* 06_* 07_* "Call Prep" stylesheets; do
            [ -d "$dir" ] && cp -r "$dir" docs/
          done
          # Copy root markdown files
          cp *.md docs/ 2>/dev/null || true
          # Remove mkdocs.yml if accidentally copied
          rm -f docs/mkdocs.yml
          echo "=== Docs folder contents ==="
          ls -la docs/

      - name: Build site
        run: mkdocs build

      - name: Password protect site
        run: |
          # Encrypt all HTML files with password
          find site -name "*.html" -type f | while read file; do
            staticrypt "$file" \
              -p "aryaduck" \
              --short \
              --template-title "MotherDuck BDR Playbook" \
              --template-instructions "Enter password to access the playbook" \
              --template-color-primary "#6B46C1" \
              --template-color-secondary "#805AD5" \
              --template-button "Unlock" \
              -o "$file"
          done
          echo "=== Password protection applied ==="

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
