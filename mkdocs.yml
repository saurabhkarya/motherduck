site_name: MotherDuck BDR Playbook
site_description: Complete sales resource and call prep toolkit
site_author: Arya

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
  font:
    text: Inter
    code: Fira Code
  icon:
    repo: fontawesome/brands/github
    logo: material/duck

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saurabhkarya/motherduck
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Call Playbook:
    - Start Here: 01_Call_Playbook/00-Start/START HERE.md
    - Opening:
      - Inbound: 01_Call_Playbook/01-Opening/Inbound Opening.md
      - Cold Outbound: 01_Call_Playbook/01-Opening/Cold Outbound Opening.md
    - Objections: 01_Call_Playbook/05-Objections/Objection Quick Reference.md
    - Competitors:
      - Snowflake: 01_Call_Playbook/06-Competitors/Snowflake.md
    - Close: 01_Call_Playbook/08-Close/Standard Close.md
  - Call Prep:
    - Overview: Call Prep/README.md
  - Training:
    - Onboarding: 02_Training/Onboarding/README.md
  - Product Knowledge:
    - Overview: 03_Product_Knowledge/README.md
  - Reference:
    - Overview: 07_Reference/README.md

# docs_dir defaults to 'docs/' - files will be copied there by GitHub Actions
# site_dir defaults to 'site/'
